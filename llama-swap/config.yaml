# llama-swap/config.yaml — canonical serving layer (SOW §D.1, §D.5, §D.6, §C.3)
# Single OpenAI- AND Anthropic-compatible endpoint fronting upstream llama.cpp
# llama-server instances on the Vulkan/RADV path. This file IS the fulfilment of
# the "stable aliases as reviewable configuration" requirement (§D.1).
#
# Re-run: /srv/z13/tools/llama-swap/llama-swap -config /srv/z13/llama-swap/config.yaml -listen 127.0.0.1:8080
# Schema: https://github.com/mostlygeek/llama-swap/blob/main/config.example.yaml (v249)

healthCheckTimeout: 600      # gpt-oss-120B cold-load can take a while
logLevel: info
logTimeFormat: "rfc3339"
logToStdout: "both"          # proxy + upstream (upstream logs = the streaming-log web UI feed, §D.1)
startPort: 10001             # ${PORT} macro base; auto-incremented per model
globalTTL: 0                 # resident models stay loaded (overridden per-model below)
unloadTimeout: 30

# --- reusable §D.5 flag block (sourced conceptually from hosts/z13.env) ---
macros:
  "llama":    "/srv/z13/tools/llama.cpp/build/bin/llama-server --port ${PORT}"
  "z13flags": "--jinja -ub 512 -ctk q8_0 -ctv q8_0 -fa auto -ngl 999 -t 8"
  "models":   "${env.HOME}/.lmstudio/models/lmstudio-community"

models:
  # ---- resident utility model (§I.2 utility-fast) ----
  utility-fast:
    name: "Gemma 4 26B-A4B QAT Q4 (utility-fast)"
    cmd: |
      ${llama} ${z13flags} -m ${models}/gemma-4-26B-A4B-it-QAT-GGUF/gemma-4-26B-A4B-it-QAT-Q4_0.gguf
    ttl: 0                    # resident (always loaded)
    concurrencyLimit: 4

  # ---- resident compact document VLM (§I.2 doc-vision) ----
  doc-vision:
    name: "Gemma 4 E4B Q4_K_M (doc-vision VLM)"
    cmd: |
      ${llama} ${z13flags} -m ${models}/gemma-4-E4B-it-GGUF/gemma-4-E4B-it-Q4_K_M.gguf
      --mmproj ${models}/gemma-4-E4B-it-GGUF/mmproj-gemma-4-E4B-it-BF16.gguf
    ttl: 0                    # resident
    concurrencyLimit: 2

  # ---- resident embedder (§D.6 utility-embed, bge-m3 class) ----
  utility-embed:
    name: "bge-m3 Q8_0 (utility-embed)"
    cmd: |
      ${llama} ${z13flags} -m ${models}/bge-m3-GGUF/bge-m3-Q8_0.gguf --embedding
    ttl: 0                    # resident; tiny (~0.6 GB)
    concurrencyLimit: 4

  # ---- swap-in large reasoning model (§I.2 reasoning-max) ----
  reasoning-max:
    name: "gpt-oss-120B MXFP4 (reasoning-max)"
    cmd: |
      ${llama} ${z13flags} -m ${models}/gpt-oss-120b-GGUF/gpt-oss-120b-MXFP4-00001-of-00002.gguf
    ttl: 900                  # unload after 15 min idle (59 GB VRAM freed when not in use)
    concurrencyLimit: 1       # memory-bandwidth-bound; one sustained request at a time (§I.1)
    unloadTimeout: 60

# ---- Cloud aliases: real provider configurations (config-driven, single source of truth)
#      scripts/cloud-proxy.py reads this config for ALL cloud settings. To add new cloud:
#      1. Add entry here with provider/base_url/model/api_key_env
#      2. export {api_key_env}='sk-...' before starting llama-swap
#      3. sudo systemctl restart llama-swap
#      cloud-proxy.py auto-discovers all models with 'provider' field. ----
  cloud-kimi-k3:
    name: "Moonshot Kimi K3"
    provider: openai
    base_url: https://api.moonshot.cn/v1/chat/completions
    model: kimi-k3
    api_key_env: KIMI_API_KEY
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

  cloud-deepseek-v4-pro:
    name: "DeepSeek V4 Pro"
    provider: openai
    base_url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

  cloud-gemini:
    name: "Google Gemini Pro"
    provider: google
    base_url: https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent
    model: gemini-pro
    api_key_env: GEMINI_API_KEY
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

  cloud-qwen:
    name: "Alibaba Qwen Max"
    provider: dashscope
    base_url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    model: qwen-max
    api_key_env: QWEN_API_KEY
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

  cloud-fable-5:
    name: "Anthropic Claude Fable 5"
    provider: anthropic
    base_url: https://api.anthropic.com/v1/messages
    model: claude-fable-5-20261022
    api_key_env: ANTHROPIC_API_KEY
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

  # ---- OpenAI 官方模型（GPT-4, GPT-3.5 等）----
  cloud-gpt-4o:
    name: "OpenAI GPT-4o"
    provider: openai
    base_url: https://api.openai.com/v1/chat/completions
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

  cloud-gpt-4o-mini:
    name: "OpenAI GPT-4o Mini"
    provider: openai
    base_url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

  # ---- Azure OpenAI（需要 deployment_name 和 api_version）----
  cloud-azure-gpt4:
    name: "Azure OpenAI GPT-4"
    provider: azure
    base_url: https://your-resource.openai.azure.com
    model: gpt-4
    deployment_name: gpt-4-deployment    # Azure 部署名
    api_version: 2024-02-15-preview      # Azure API 版本
    api_key_env: AZURE_OPENAI_API_KEY
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

  # ---- 自定义 OpenAI 兼容端点（vLLM, Ollama Cloud, 私有部署等）----
  cloud-custom-vllm:
    name: "Custom vLLM Endpoint"
    provider: openai
    base_url: https://your-vllm-server.com/v1/chat/completions
    model: meta-llama/Llama-3-70b
    api_key_env: CUSTOM_VLLM_API_KEY
    custom_headers:
      X-Custom-Header: "value"    # 可选：自定义 HTTP 头
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

  # ---- 更多自定义端点示例 ----
  cloud-ollama-cloud:
    name: "Ollama Cloud"
    provider: openai
    base_url: https://api.ollama.cloud/v1/chat/completions
    model: llama3.1-70b
    api_key_env: OLLAMA_CLOUD_API_KEY
    cmd: /usr/bin/python3 /srv/z13/scripts/cloud-proxy.py ${PORT}
    ttl: 0

# ---- §D.1 model groups: keep the three utilities resident together while
#      reasoning-max swaps in/out. VRAM budget: 13.5 + 5 + 0.6 ≈ 19 GB resident,
#      +59 GB when reasoning-max is loaded = ~78 GB of 96 (headroom). ----
groups:
  utilities:
    swap: false               # members stay resident simultaneously
    members:
      - utility-fast
      - doc-vision
      - utility-embed

# include cloud alias IDs in /v1/models so clients can discover them
includeAliasesInList: true
