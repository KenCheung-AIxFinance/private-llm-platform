# compose/compose.yaml — §D.4 Compose services in the state root
# llama-swap runs BARE-METAL (it manages the bare-metal llama-server instances on
# the Vulkan/RADV path, §D.5 — containerising it would break GPU access). It is
# brought up at boot by the systemd unit systemd/llama-swap.service (§J.1), not by
# this Compose. This Compose file holds the services that ARE containerised:
# Open WebUI (primary interface) + the monitoring stack stub. They reach the
# bare-metal llama-swap via the host gateway.
#
# Bring up:   docker compose -f /srv/z13/compose/compose.yaml up -d
# (after systemd/llama-swap.service has started llama-swap on 127.0.0.1:8080)

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    # §E.3/§H.1: bind to loopback only at M2; PWA-over-Tailscale exposure is M4.
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      # point Open WebUI at the bare-metal llama-swap endpoint (host gateway)
      - OLLAMA_BASE_URL=http://host.docker.internal:8080
      - WEBUI_AUTH=true
      - ENABLE_OLLAMA_API=true
      - OPENAI_API_BASE_URL=http://host.docker.internal:8080/v1
      - OPENAI_API_KEY=none      # llama-swap is default-allow (no apiKeys set)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    # §D.4: nothing else left to interpretation — add monitoring stack here when built

volumes:
  open-webui:
